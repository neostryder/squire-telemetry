name = "squire-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-27"
workers_dev = false
routes = [{ pattern = "squire.rpgm.tools", custom_domain = true }]

# Request logging stays off: the Worker never records addresses, and Workers logs would.
[observability]
enabled = false

[vars]
RETENTION_DAYS = "180"
# The Cloudflare Access app "Squire review" covers /admin*; the Worker checks its token against this audience tag too.
ACCESS_TEAM = "rpgm.cloudflareaccess.com"
ACCESS_AUD = "d44087a8374b185a05e7cf4d8a73ad89f9e57e32fc63a31dcc69e316d4124c68"

[[d1_databases]]
binding = "DB"
database_name = "squire-telemetry"
database_id = "743728a9-b9f0-4173-949b-3374dfe65af1"

# 30 batches a minute per address and 10 per install. Cloudflare's rate limiting keeps the counters, not the addresses.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "INSTALL_LIMIT"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# The retention sweep once a day, and every 15 minutes a retry of Discord posts that failed.
[triggers]
crons = ["17 9 * * *", "*/15 * * * *"]
